<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
  <!-- Candlestick chart -->
  <!-- Candle 1 (red/bearish) -->
  <rect x="4" y="14" width="4" height="10" fill="#e74c3c"/>
  <line x1="6" y1="10" x2="6" y2="14" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="6" y1="24" x2="6" y2="27" stroke="#e74c3c" stroke-width="1.5"/>
  <!-- Candle 2 (green/bullish) -->
  <rect x="11" y="8" width="4" height="14" fill="#2ecc71"/>
  <line x1="13" y1="5" x2="13" y2="8" stroke="#2ecc71" stroke-width="1.5"/>
  <line x1="13" y1="22" x2="13" y2="26" stroke="#2ecc71" stroke-width="1.5"/>
  <!-- Candle 3 (green/bullish) -->
  <rect x="18" y="6" width="4" height="12" fill="#2ecc71"/>
  <line x1="20" y1="3" x2="20" y2="6" stroke="#2ecc71" stroke-width="1.5"/>
  <line x1="20" y1="18" x2="20" y2="22" stroke="#2ecc71" stroke-width="1.5"/>
  <!-- Candle 4 (red/bearish) -->
  <rect x="25" y="10" width="4" height="8" fill="#e74c3c"/>
  <line x1="27" y1="7" x2="27" y2="10" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="27" y1="18" x2="27" y2="22" stroke="#e74c3c" stroke-width="1.5"/>
</svg>
